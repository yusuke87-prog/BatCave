<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }

body {

body::before {

  width: 120%;

  background: radial-gradient(ellipse at center, rgba(250, 204, 21, 0.06) 0%, transparent 60%);

}

.item-list { display: flex; flex-direction: column; gap: 10px; }

.progress-bar {

.progress-fill.warning { background: linear-gradient(90deg, var(--warning), #fbbf24); }

.modal {

  transform: translateY(100%);

}

.modal-overlay.active .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  justify-content: space-between;

}

.modal-header h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; color: var(--primary); }

.text-center { text-align: center; }
.mt-1 { margin-top: 10px; }

@keyframes fadeIn {

  to { opacity: 1; transform: translateY(0); }
}

.section-content { animation: fadeIn 0.35s ease; }

.note-preview {

const ChatEngine = {
  sendMessage(character, text) {
    const msgs = DB.get('chat_messages', {});
    if (!msgs[character]) msgs[character] = [];
    const now = new Date();
    const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    msgs[character].push({ role: 'user', text, time });
    const reply = this.getReply(character, text.toLowerCase());
    msgs[character].push({ role: 'assistant', text: reply, time });
    DB.set('chat_messages', msgs);
    this.renderChat(character);
  },

  getReply(character, msg) {
    const today = App.formatDate();
    const logs = DB.get('nutrition_logs');
    let log = logs.find(l => l.date === today);
    if (!log) log = { date: today, meals: [], water: 0, weight: null, totals: {kcal:0, p:0, c:0, f:0} };
    const goals = DB.get('nutrition_goals', {});
    const fin = DB.get('finance_transactions');
    const currentMonth = today.slice(0, 7);
    const monthTx = fin.filter(t => t.date.startsWith(currentMonth));
    const expense = monthTx.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
    const income = monthTx.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
    const balance = income - expense;
    const vehicles = DB.get('transport_vehicles');
    const refuels = DB.get('transport_refuels');
    const maint = DB.get('transport_maintenance');
    const notes = DB.get('notes');
    const hitek = DB.get('hitek_items');

    // ALFRED
    if (character === 'alfred') {
      if (msg.includes('ciao') || msg.includes('hey') || msg.includes('salve')) return 'Buongiorno, signore. Alfred è a sua disposizione. Come posso essere utile oggi?';
      if (msg.includes('calori') || msg.includes('kcal') || msg.includes('mangiato')) return 'Oggi ha consumato ' + log.totals.kcal + ' kcal su ' + goals.calories + '. ' + (log.totals.kcal < goals.calories ? 'Le mancano ' + (goals.calories - log.totals.kcal) + ' kcal. Le preparo qualcosa?' : 'Obiettivo raggiunto, signore. Eccellente.');
      if (msg.includes('acqua') || msg.includes('bere') || msg.includes('bibita')) return 'Ha bevuto ' + log.water + 'ml su ' + goals.water + 'ml. ' + (log.water < goals.water ? 'Le consiglio di bere altri ' + (goals.water - log.water) + 'ml, signore.' : 'Idratazione ottimale, signore.');
      if (msg.includes('peso') || msg.includes('kg') || msg.includes('grasso')) {
        if (log.weight) return 'Il suo peso odierno è ' + log.weight + 'kg. ' + (logs.filter(l => l.weight).length > 1 ? 'Sto monitorando la tendenza, signore.' : 'Continui a registrarlo per avere un quadro completo.');
        return 'Non ha registrato il peso oggi, signore. Vuole che prepari la bilancia?';
      }
      if (msg.includes('proteina') || msg.includes('proteine')) return 'Proteine oggi: ' + log.totals.p + 'g su ' + goals.protein + 'g. ' + (log.totals.p < goals.protein ? 'Suggerisco petto di pollo o uova per recuperare.' : 'Ottimo apporto proteico.');
      if (msg.includes('pasto') || msg.includes('pranzo') || msg.includes('cena') || msg.includes('colazione')) {
        if (!log.meals.length) return 'Nessun pasto registrato oggi, signore. Le preparo qualcosa di nutriente?';
        return 'Oggi ha consumato ' + log.meals.length + ' pasti: ' + log.meals.map(m => m.name.split(':')[0]).join(', ') + '.';
      }
      if (msg.includes('cibo') || msg.includes('aliment')) return 'Ha a disposizione ' + DB.get('nutrition_foods').length + ' alimenti nel database. Vuole che ne aggiunga altri, signore?';
      return 'Mi scusi, signore. Non ho capito perfettamente. Posso aiutarla con calorie, proteine, acqua, peso o pasti. Cosa desidera sapere?';
    }

    // FOX
    if (character === 'fox') {
      if (msg.includes('ciao') || msg.includes('hey') || msg.includes('salve')) return 'Buongiorno, signore Wayne. Lucius Fox, CEO di Wayne Enterprises. Cosa posso fare per lei?';
      if (msg.includes('saldo') || msg.includes('bilancio') || msg.includes('conto')) return 'Il saldo di questo mese è ' + App.formatCurrency(balance) + '. Entrate: ' + App.formatCurrency(income) + ', Uscite: ' + App.formatCurrency(expense) + '.';

        });

      if (msg.includes('auto') || msg.includes('macchina') || msg.includes('veicolo') || msg.includes('flotta')) {
        return 'Flotta attuale: ' + vehicles.map(v => v.name + ' (' + v.fuelType + ')').join(', ') + '. Totale: ' + vehicles.length + ' veicoli.';

        const km = vRef.length ? Math.max(...vRef.map(r => r.km)) : 0;

      }
      if (msg.includes('carburante') || msg.includes('benzina') || msg.includes('diesel') || msg.includes('prezzo')) {
        const last = refuels[refuels.length - 1];
        return last ? 'Ultimo rifornimento: ' + (last.cost / last.liters).toFixed(2) + '€/L per ' + last.liters + 'L. Costo totale: ' + App.formatCurrency(last.cost) + '.' : 'Nessun rifornimento registrato, Boss.';
      }
      if (msg.includes('manutenzione') || msg.includes('tagliando') || msg.includes('controllo')) {
        const v = vehicles[0];
        const vMaint = maint.filter(m => m.vehicleId === v.id);
        return vMaint.length ? 'Ultima manutenzione ' + v.name + ': ' + vMaint[vMaint.length - 1].type + ' il ' + vMaint[vMaint.length - 1].date.split('-').reverse().join('/') + '.' : 'Nessuna manutenzione registrata per ' + v.name + ', Boss.';
      }
      if (msg.includes('costo') || msg.includes('spesa') || msg.includes('soldi')) {
        const v = vehicles[0];
        const vRef = refuels.filter(r => r.vehicleId === v.id);
        const vMaint = maint.filter(m => m.vehicleId === v.id);
        const total = vRef.reduce((a, b) => a + b.cost, 0) + vMaint.reduce((a, b) => a + b.cost, 0);
        return 'Spesa totale per ' + v.name + ': ' + App.formatCurrency(total) + ' (' + vRef.length + ' rifornimenti, ' + vMaint.length + ' interventi).';
      }
      return 'Non ho capito, Boss. Posso aiutarti con veicoli, km, carburante, manutenzione o costi. Cosa ti serve?';
    }

    // ORACLE
    if (character === 'oracle') {
      if (msg.includes('ciao') || msg.includes('hey') || msg.includes('salve')) return 'Ciao. Oracle online. Rete collegata. Cosa cerchi nell\'archivio?';
      if (msg.includes('nota') || msg.includes('file') || msg.includes('archivio')) return 'Archivio attuale: ' + notes.length + ' file memorizzati. ' + (notes.length > 0 ? 'Ultimo: "' + notes[notes.length - 1].title + '".' : 'Archivio vuoto. Vuoi crearne uno?');
      if (msg.includes('gadget') || msg.includes('progetto') || msg.includes('hitek') || msg.includes('tech')) {

      }
      if (msg.includes('cerca') || msg.includes('trova') || msg.includes('dove')) {
        return 'Posso cercare nell\'archivio. Usa la funzione di ricerca nella sezione Archivio. O vuoi che crei un nuovo file?';
      }
      return 'Non ho capito. Posso aiutarti con file, archivio, gadget o progetti Hi-Tek. Cosa ti serve?';
    }

    // BATCOMPUTER (generale)
    if (msg.includes('ciao') || msg.includes('hey') || msg.includes('salve')) return 'Batcomputer online. Sistema operativo. Come posso assisterti, signore?';
    if (msg.includes('riepilogo') || msg.includes('situazione') || msg.includes('tutto')) {
      return 'Riepilogo giornaliero:<br>Calorie: ' + log.totals.kcal + '/' + goals.calories + '<br>Acqua: ' + log.water + 'ml/' + goals.water + 'ml<br>Saldo finanze: ' + App.formatCurrency(balance) + '<br>Veicoli: ' + vehicles.length + '<br>File Oracle: ' + notes.length;
    }
    return 'Batcomputer non ha compreso la richiesta. Puoi chiedermi un riepilogo generale o contattare un assistente specifico: Alfred, Fox, Robin o Oracle.';
  },

  renderChat(character) {
    const msgs = DB.get('chat_messages', {});
    const list = msgs[character] || [];
    const names = { batcomputer: '🖥️ Batcomputer', alfred: '🍽️ Alfred', fox: '💼 Fox', robin: '🏍️ Robin', oracle: '📟 Oracle' };
    const html = list.map(m => '<div class="chat-bubble ' + m.role + '"><div class="chat-name">' + (m.role === 'user' ? 'Tu' : names[character]) + '</div>' + m.text + '<div class="chat-time">' + m.time + '</div></div>').join('');
    const welcome = list.length === 0 ? '<div class="chat-welcome"><div class="emoji">💬</div><div style="font-weight:700;margin-bottom:4px">Chat con ' + names[character] + '</div><div style="font-size:13px">Scrivi un messaggio per iniziare la conversazione</div></div>' : '';
    const container = document.getElementById('chat-messages-' + character);
    if (container) {
      container.innerHTML = welcome + html;
      container.scrollTop = container.scrollHeight;
    }
  },

  openChat(character) {
    const names = { batcomputer: '🖥️ Batcomputer', alfred: '🍽️ Alfred', fox: '💼 Fox', robin: '🏍️ Robin', oracle: '📟 Oracle' };
    const main = document.getElementById('main-content');

    this.renderChat(character);
    setTimeout(() => document.getElementById('chat-input-' + character).focus(), 100);
  },

  handleSend(character) {
    const input = document.getElementById('chat-input-' + character);

    input.value = '';
    this.sendMessage(character, text);

const AlfredAI = {
  goalsMeta: {
    cut:   { label: 'Definizione / perdita peso', kcalAdj: -400, pFactor: 2.2, fPct: 0.30 },
    recomp:{ label: 'Ricomposizione corporea',    kcalAdj: -100, pFactor: 2.0, fPct: 0.28 },
    bulk:  { label: 'Massa muscolare',            kcalAdj: 300,  pFactor: 2.0, fPct: 0.27 },
    maint: { label: 'Mantenimento',               kcalAdj: 0,    pFactor: 1.8, fPct: 0.28 }
  },
  slotDefs: [
    { name: 'Colazione', pct: 0.25, tag: 'C', n: 3 },
    { name: 'Spuntino',  pct: 0.08, tag: 'S', n: 2 },
    { name: 'Pranzo',    pct: 0.30, tag: 'L', n: 4 },
    { name: 'Merenda',   pct: 0.07, tag: 'S', n: 2 },
    { name: 'Cena',      pct: 0.30, tag: 'D', n: 4 }
  ],
  computeTargets(profile, goal, weeks) {
    const meta = this.goalsMeta[goal] || this.goalsMeta.maint;
    const bmr = 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + (profile.sex === 'M' ? 5 : -161);
    const tdee = Math.round(bmr * profile.activity);
    // deficit/surplus calibrato sul tempo disponibile
    let adj = meta.kcalAdj;
    if (goal === 'cut') adj = weeks >= 16 ? -300 : weeks >= 8 ? -400 : -500;
    if (goal === 'bulk') adj = weeks >= 16 ? 200 : 300;
    let kcal = Math.max(1200, Math.round((tdee + adj) / 10) * 10);
    const p = Math.round(meta.pFactor * profile.weight);
    const f = Math.round(kcal * meta.fPct / 9);
    const c = Math.max(50, Math.round((kcal - p * 4 - f * 9) / 4));
    kcal = Math.round((p * 4 + c * 4 + f * 9) / 10) * 10;
    const weekly = goal === 'cut' ? -Math.round(Math.abs(adj) * 7 / 7700 * 100) / 100
                 : goal === 'bulk' ? Math.round(adj * 7 / 7700 * 100) / 100 : 0;
    return { kcal, p, c, f, tdee, bmr: Math.round(bmr), weekly };
  },
  rand(a) { return a[Math.floor(Math.random() * a.length)]; },
  buildSlot(slotKcal, tag, nFoods, keep) {
    const pool = DB.get('nutrition_foods').filter(f => f.tags.indexOf(tag) >= 0 && (!keep || keep.indexOf(f.n) < 0));
    const cats = {};
    pool.forEach(f => { (cats[f.cat] = cats[f.cat] || []).push(f); });
    const keys = Object.keys(cats).sort(() => Math.random() - 0.5);
    let picks = [];
    for (const k of keys) { if (picks.length >= nFoods) break; picks.push(this.rand(cats[k])); }
    if (!picks.length) picks = [this.rand(DB.get('nutrition_foods'))];
    // assicura una fonte proteica nei pasti principali
    if (slotKcal >= 400 && !picks.some(f => f.p >= 6)) {
      const rich = pool.filter(f => f.p >= 12);
      if (rich.length) picks[picks.length - 1] = this.rand(rich);
    }
    const baseK = picks.reduce((a, f) => a + f.k * f.porz / 100, 0);
    const scale = slotKcal / baseK;
    return picks.map(f => {
      const qty = Math.max(5, Math.round(f.porz * scale / 5) * 5);
      const r = qty / 100;
      return { n: f.n, qty, k: Math.round(f.k * r), p: Math.round(f.p * r * 10) / 10, c: Math.round(f.c * r * 10) / 10, f: Math.round(f.f * r * 10) / 10 };
    });
  },
  dayScore(slots, targets) {
    const T = { k: 0, p: 0, c: 0, f: 0 };
    slots.forEach(s => s.foods.forEach(fd => { T.k += fd.k; T.p += fd.p; T.c += fd.c; T.f += fd.f; }));
    return Math.pow(T.k - targets.kcal, 2) / 300 + Math.pow(T.p - targets.p, 2) * 1.2 + Math.pow(T.c - targets.c, 2) * 0.6 + Math.pow(T.f - targets.f, 2);
  },
  generate(targets) {
    let best = null, bestScore = 1e18;
    for (let it = 0; it < 150; it++) {
      const slots = this.slotDefs.map(sd => ({
        name: sd.name,
        kcal: Math.round(targets.kcal * sd.pct),
        foods: this.buildSlot(Math.round(targets.kcal * sd.pct), sd.tag, sd.n)
      }));
      const sc = this.dayScore(slots, targets);
      if (sc < bestScore) { bestScore = sc; best = slots; }
    }
    return best;
  },
  reroll(plan, slotIdx) {
    const sd = this.slotDefs[slotIdx];
    const keep = plan.slots[slotIdx].foods.map(fd => fd.n);
    plan.slots[slotIdx].foods = this.buildSlot(plan.slots[slotIdx].kcal, sd.tag, sd.n, keep);
    DB.set('nutrition_plan', plan);
  }
};

        const foods = s.foods.map(fd => '<div class="food-line"><span>' + fd.n + '</span><span>' + fd.qty + 'g · ' + fd.k + ' kcal</span></div>').join('');
        const totK = s.foods.reduce((a, fd) => a + fd.k, 0);

      }).join('');
      planCard = '<div class="card"><div class="card-title">🧠 Piano nutrizionale · ' + goalLabel + '</div>' +
        '<div class="stats-grid">' +
        '<div class="stat-box"><div class="stat-value">' + t.kcal + '</div><div class="stat-label">kcal/giorno</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + t.p + 'g</div><div class="stat-label">proteine</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + t.c + 'g</div><div class="stat-label">carbo</div></div>' +
        '<div class="stat-box"><div class="stat-value">' + t.f + 'g</div><div class="stat-label">grassi</div></div>' +
        '</div>' +
        (t.weekly ? '<div class="mt-1" style="font-size:12px;color:var(--text-2)">Obiettivo stimato: ' + (t.weekly > 0 ? '+' : '') + t.weekly + ' kg/settimana</div>' : '') +
        slotsHtml +
        '<button class="btn btn-primary mt-1" onclick="alfred.applyPlan()">✅ Applica menu a oggi</button>' +
        '<button class="btn btn-secondary mt-1" onclick="alfred.openWizard()">🔁 Nuovo piano</button></div>';
    } else {
      planCard = '<div class="card"><div class="card-title">🧠 Alfred Nutrizionista</div>' +
        '<div style="font-size:13px;color:var(--text-2);margin-bottom:10px">Alfred può progettare un protocollo su misura: perdita di peso, ricomposizione corporea o massa muscolare, con menu giornalieri completi.</div>' +
        '<button class="btn btn-primary" onclick="alfred.openWizard()">🧬 Crea il mio piano</button></div>';
    }

    const searchCard = '<div class="card"><div class="flex flex-between mb-1"><div class="card-title">🔍 Database alimenti</div><span class="macro-chip">' + DB.get('nutrition_foods').length + ' cibi</span></div>' +
      '<input type="text" id="food-search" placeholder="Cerca un alimento (es. pollo, riso, mela)..." oninput="alfred.renderFoodResults(this.value)" autocomplete="off">' +
      '<div id="food-results" class="mt-1"></div></div>';

    return planCard +
      '<div class="card"><div class="card-title">💬 Parla con Alfred</div>' +
      '<button class="btn btn-primary mb-1" onclick="ChatEngine.openChat(\'alfred\')">Apri chat con Alfred</button>' +
      '<div style="font-size:12px;color:var(--text-2)">Chiedi di calorie, acqua, peso, proteine, pasti...</div></div>' +
      '<div class="card"><div class="flex flex-between mb-1"><div class="card-title">🎯 Protocollo nutrizionale</div><button class="btn btn-sm btn-secondary" onclick="alfred.openWizard()">⚙️ Ricalcola</button></div>' +
      '<div class="stats-grid">' +
      '<div class="stat-box"><div class="stat-value">' + log.totals.kcal + '</div><div class="stat-label">/' + goals.calories + ' kcal</div><div class="progress-bar"><div class="progress-fill ' + (cp > 90 ? 'danger' : cp > 75 ? 'warning' : '') + '" style="width:' + cp + '%"></div></div></div>' +
      '<div class="stat-box"><div class="stat-value">' + log.totals.p + 'g</div><div class="stat-label">/' + goals.protein + 'g proteine</div><div class="progress-bar"><div class="progress-fill" style="width:' + pp + '%"></div></div></div>' +
      '<div class="stat-box"><div class="stat-value">' + log.totals.c + 'g</div><div class="stat-label">/' + goals.carbs + 'g carboidrati</div><div class="progress-bar"><div class="progress-fill" style="width:' + carp + '%"></div></div></div>' +
      '<div class="stat-box"><div class="stat-value">' + log.totals.f + 'g</div><div class="stat-label">/' + goals.fat + 'g grassi</div><div class="progress-bar"><div class="progress-fill" style="width:' + fp + '%"></div></div></div>' +
      '</div>' +
      '<div class="mt-2 flex flex-between"><span>💧 ' + log.water + 'ml / ' + goals.water + 'ml</span><button class="btn btn-sm btn-primary" onclick="alfred.addWater()">+ 250ml</button></div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + wp + '%"></div></div></div>' +
      searchCard +
      '<div class="card"><div class="flex flex-between mb-1"><div class="card-title">🍽️ Pasti del giorno</div><button class="btn btn-sm btn-primary" onclick="alfred.openAddMeal()">+ Servi</button></div><div class="item-list">' + mealList + '</div></div>' +
      '<div class="card"><div class="card-title">⚖️ Monitoraggio peso</div><div class="flex gap-1 mt-1"><input type="number" id="weight-input" placeholder="kg" value="' + (log.weight || '') + '" step="0.1" style="flex:1"><button class="btn btn-primary" style="width:auto" onclick="alfred.saveWeight()">Registra</button></div></div>';
  },
  init() {},
  renderFoodResults(q) {
    const box = document.getElementById('food-results');
    if (!box) return;
    q = (q || '').trim().toLowerCase();
    if (q.length < 2) { box.innerHTML = '<div style="font-size:12px;color:var(--text-2)">Digita almeno 2 caratteri per cercare tra i ' + DB.get('nutrition_foods').length + ' alimenti</div>'; return; }
    const foods = DB.get('nutrition_foods');
    const res = foods.filter(f => f.n.toLowerCase().indexOf(q) >= 0).slice(0, 12);
    box.innerHTML = res.map(f =>
      '<div class="item-row food-res" onclick="alfred.openFoodDetail(\'' + f.n.replace(/'/g, "\\'") + '\')">' +
      '<div class="item-info"><div class="item-title">' + f.n + '</div>' +
      '<div class="item-sub">' + f.k + ' kcal · P:' + f.p + ' C:' + f.c + ' F:' + f.f + ' <span class="macro-chip">' + f.cat + '</span></div></div>' +
      '<div class="item-actions"><button class="btn btn-sm btn-primary">＋</button></div></div>'
    ).join('') || '<div class="empty-state"><div class="emoji">🔍</div>Nessun alimento trovato, signore</div>';
  },
  openFoodDetail(name) {
    const f = DB.get('nutrition_foods').find(x => x.n === name);
    if (!f) return;
    const safeName = name.replace(/'/g, "\\'");
    App.openModal('🍎 ' + f.n,
      '<div class="stats-grid mb-1">' +
      '<div class="stat-box"><div class="stat-value">' + f.k + '</div><div class="stat-label">kcal/100g</div></div>' +
      '<div class="stat-box"><div class="stat-value">' + f.p + 'g</div><div class="stat-label">proteine</div></div>' +
      '<div class="stat-box"><div class="stat-value">' + f.c + 'g</div><div class="stat-label">carbo</div></div>' +
      '<div class="stat-box"><div class="stat-value">' + f.f + 'g</div><div class="stat-label">grassi</div></div>' +
      '</div>' +
      '<div class="form-group"><label>Quantità (g)</label><input type="number" id="fd-qty" value="' + f.porz + '" step="5" oninput="alfred.updateFoodDetail(\'' + safeName + '\')"></div>' +
      '<div class="form-group"><label>Pasto</label><select id="fd-slot"><option>Colazione</option><option>Spuntino</option><option>Pranzo</option><option>Merenda</option><option>Cena</option><option>Altro</option></select></div>' +
      '<div id="fd-preview" class="mb-1" style="font-size:13px"></div>' +
      '<button class="btn btn-primary" onclick="alfred.addFoodToLog(\'' + safeName + '\')">Aggiungi al diario</button>');
    this.updateFoodDetail(name);
  },
  updateFoodDetail(name) {
    const f = DB.get('nutrition_foods').find(x => x.n === name);
    const qty = parseFloat(document.getElementById('fd-qty').value) || 0;
    const r = qty / 100;
    const pv = document.getElementById('fd-preview');
    if (pv) pv.innerHTML = '<b>' + Math.round(f.k * r) + ' kcal</b> · P: ' + Math.round(f.p * r * 10) / 10 + 'g · C: ' + Math.round(f.c * r * 10) / 10 + 'g · F: ' + Math.round(f.f * r * 10) / 10 + 'g';
  },
  addFoodToLog(name) {
    const f = DB.get('nutrition_foods').find(x => x.n === name);
    const qty = parseFloat(document.getElementById('fd-qty').value) || 0;
    const slot = document.getElementById('fd-slot').value;
    if (!f || qty <= 0) return;
    const r = qty / 100;
    const entry = { name: slot + ': ' + f.n, qty, unit: 'g', kcal: Math.round(f.k * r), p: Math.round(f.p * r * 10) / 10, c: Math.round(f.c * r * 10) / 10, f: Math.round(f.f * r * 10) / 10 };
    this.pushEntry(entry);
    App.closeModal();
    App.navigate('alfred');
  },
  pushEntry(entry) {
    const today = App.formatDate();
    let logs = DB.get('nutrition_logs');
    let idx = logs.findIndex(l => l.date === today);
    let log;
    if (idx >= 0) { log = logs[idx]; }
    else { log = { date: today, meals: [], water: 0, weight: null, totals: { kcal: 0, p: 0, c: 0, f: 0 } }; logs.push(log); idx = logs.length - 1; }
    log.meals.push(entry);
    log.totals.kcal += entry.kcal; log.totals.p += entry.p; log.totals.c += entry.c; log.totals.f += entry.f;
    logs[idx] = log;
    DB.set('nutrition_logs', logs);
  },
  addWater() {
    const today = App.formatDate();
    let logs = DB.get('nutrition_logs');
    let idx = logs.findIndex(l => l.date === today);
    let log;
    if (idx >= 0) { log = logs[idx]; }
    else { log = { date: today, meals: [], water: 0, weight: null, totals: { kcal: 0, p: 0, c: 0, f: 0 } }; logs.push(log); idx = logs.length - 1; }
    log.water += 250; logs[idx] = log;
    DB.set('nutrition_logs', logs);
    App.navigate('alfred');
  },
  saveWeight() {
    const v = parseFloat(document.getElementById('weight-input').value);
    if (isNaN(v)) return;
    const today = App.formatDate();
    let logs = DB.get('nutrition_logs');
    let idx = logs.findIndex(l => l.date === today);
    if (idx >= 0) { logs[idx].weight = v; }
    else { logs.push({ date: today, meals: [], water: 0, weight: v, totals: { kcal: 0, p: 0, c: 0, f: 0 } }); }
    DB.set('nutrition_logs', logs);
    alert('Peso registrato, signore.');
  },
  removeMeal(idx) {
    const today = App.formatDate();
    let logs = DB.get('nutrition_logs');
    let logIdx = logs.findIndex(l => l.date === today);
    if (logIdx < 0) return;
    let log = logs[logIdx];
    const m = log.meals.splice(idx, 1)[0];
    log.totals.kcal = Math.max(0, log.totals.kcal - m.kcal);
    log.totals.p = Math.max(0, log.totals.p - m.p);
    log.totals.c = Math.max(0, log.totals.c - m.c);
    log.totals.f = Math.max(0, log.totals.f - m.f);
    logs[logIdx] = log;
    DB.set('nutrition_logs', logs);
    App.navigate('alfred');
  },
  openAddMeal() {
    App.openModal('🔍 Servi un alimento',
      '<input type="text" id="meal-food-search" placeholder="Cerca negli alimenti..." oninput="alfred.renderModalFoodResults(this.value)" autocomplete="off">' +
      '<div id="modal-food-results" class="mt-1"></div>');
    setTimeout(() => document.getElementById('meal-food-search').focus(), 100);
  },
  renderModalFoodResults(q) {
    const box = document.getElementById('modal-food-results');
    q = (q || '').trim().toLowerCase();
    if (q.length < 2) { box.innerHTML = '<div style="font-size:12px;color:var(--text-2)">Digita per cercare...</div>'; return; }
    const res = DB.get('nutrition_foods').filter(f => f.n.toLowerCase().indexOf(q) >= 0).slice(0, 10);
    box.innerHTML = res.map(f => '<div class="item-row food-res" onclick="alfred.openFoodDetail(\'' + f.n.replace(/'/g, "\\'") + '\')"><div class="item-info"><div class="item-title">' + f.n + '</div><div class="item-sub">' + f.k + ' kcal/100g</div></div></div>').join('') || '<div class="empty-state">Nessun risultato</div>';
  },
  openWizard() {
    const p = DB.get('nutrition_profile', {});
    const goals = DB.get('nutrition_goals', {});
    App.openModal('🧬 Consulenza di Alfred',
      '<div style="font-size:13px;color:var(--text-2);margin-bottom:12px">Alfred calcolerà il suo fabbisogno e compilerà un menu giornaliero su misura.</div>' +
      '<div class="form-group"><label>Sesso</label><select id="w-sex"><option value="M" ' + (p.sex === 'M' ? 'selected' : '') + '>Maschile</option><option value="F" ' + (p.sex === 'F' ? 'selected' : '') + '>Femminile</option></select></div>' +
      '<div class="form-group"><label>Età</label><input type="number" id="w-age" value="' + (p.age || 30) + '" min="14" max="99"></div>' +
      '<div class="form-group"><label>Altezza (cm)</label><input type="number" id="w-height" value="' + (p.height || 175) + '" min="130" max="230"></div>' +
      '<div class="form-group"><label>Peso attuale (kg)</label><input type="number" id="w-weight" value="' + (p.weight || 75) + '" step="0.1" min="35" max="250"></div>' +
      '<div class="form-group"><label>Attività fisica</label><select id="w-activity">' +
      '<option value="1.2" ' + (p.activity === 1.2 ? 'selected' : '') + '>Sedentaria (ufficio, poco movimento)</option>' +
      '<option value="1.375" ' + (!p.activity || p.activity === 1.375 ? 'selected' : '') + '>Leggera (1-3 allenamenti/settimana)</option>' +
      '<option value="1.55" ' + (p.activity === 1.55 ? 'selected' : '') + '>Moderata (3-5 allenamenti/settimana)</option>' +
      '<option value="1.725" ' + (p.activity === 1.725 ? 'selected' : '') + '>Intensa (6-7 allenamenti/settimana)</option>' +
      '<option value="1.9" ' + (p.activity === 1.9 ? 'selected' : '') + '>Atleta (2 volte al giorno)</option></select></div>' +
      '<div class="form-group"><label>Obiettivo</label><select id="w-goal">' +
      '<option value="cut">Perdita di peso (definizione)</option>' +
      '<option value="recomp">Ricomposizione corporea (grasso → muscolo)</option>' +
      '<option value="bulk">Aumento massa muscolare</option>' +
      '<option value="maint">Mantenimento</option></select></div>' +
      '<div class="form-group"><label>Tempo a disposizione (settimane)</label><input type="number" id="w-weeks" value="12" min="2" max="52"></div>' +
      '<button class="btn btn-primary" onclick="alfred.confirmWizard()">🧠 Genera il mio piano</button>');
  },
  confirmWizard() {
    const profile = {
      sex: document.getElementById('w-sex').value,
      age: parseInt(document.getElementById('w-age').value) || 30,
      height: parseFloat(document.getElementById('w-height').value) || 175,
      weight: parseFloat(document.getElementById('w-weight').value) || 75,
      activity: parseFloat(document.getElementById('w-activity').value) || 1.375
    };
    const goal = document.getElementById('w-goal').value;
    const weeks = parseInt(document.getElementById('w-weeks').value) || 12;
    DB.set('nutrition_profile', profile);
    const targets = AlfredAI.computeTargets(profile, goal, weeks);
    const goals = DB.get('nutrition_goals', {});
    DB.set('nutrition_goals', { calories: targets.kcal, protein: targets.p, carbs: targets.c, fat: targets.f, water: goals.water || 2500 });
    const slots = AlfredAI.generate(targets);
    DB.set('nutrition_plan', { targets, slots, goal, created: App.formatDate() });
    App.closeModal();
    App.navigate('alfred');
  },
  rerollSlot(i) {
    const plan = DB.get('nutrition_plan');
    if (!plan) return;
    AlfredAI.reroll(plan, i);
    App.navigate('alfred');
  },
  applyPlan() {
    const plan = DB.get('nutrition_plan');
    if (!plan) return;
    const today = App.formatDate();
    const logs = DB.get('nutrition_logs');
    const log = logs.find(l => l.date === today);
    if (log && log.meals.length && !confirm('Oggi ha già dei pasti registrati. Aggiungo il menu del piano a quelli esistenti?')) return;
    plan.slots.forEach(s => s.foods.forEach(fd => {
      this.pushEntry({ name: s.name + ': ' + fd.n, qty: fd.qty, unit: 'g', kcal: fd.k, p: fd.p, c: fd.c, f: fd.f });
    }));
    App.navigate('alfred');
  }
};


const fox = {

  init() {},
  openAddTx() {
    const cats = DB.get('finance_categories');
    const opts = cats.map(c => '<option value="' + c.id + '">' + c.icon + ' ' + c.name + '</option>').join('');
    App.openModal('Nuova transazione', '<div class="form-group"><label>Tipo</label><select id="tx-type"><option value="expense">⬇️ Uscita</option><option value="income">⬆️ Entrata</option></select></div><div class="form-group"><label>Importo (€)</label><input type="number" id="tx-amount" step="0.01" placeholder="0.00"></div><div class="form-group"><label>Categoria</label><select id="tx-category">' + opts + '</select></div><div class="form-group"><label>Data</label><input type="date" id="tx-date" value="' + App.formatDate() + '"></div><div class="form-group"><label>Note</label><input type="text" id="tx-note" placeholder="Es. Spesa settimanale"></div><button class="btn btn-primary" onclick="fox.saveTx()">Salva</button>');
  },
  saveTx() {
    const type = document.getElementById('tx-type').value;
    const amount = parseFloat(document.getElementById('tx-amount').value);
    const category = document.getElementById('tx-category').value;
    const date = document.getElementById('tx-date').value;
    const note = document.getElementById('tx-note').value;

    App.navigate('fox');

};

const robin = {

    const refuels = DB.get('transport_refuels');

    if (!vehicles.length) return '<div class="empty-state"><div class="emoji">🏍️</div>Flotta vuota</div>';

    const vMaint = maint.filter(m => m.vehicleId === v.id);
    const lastRef = vRef[vRef.length - 1];
    const totalKm = vRef.length ? Math.max(...vRef.map(r => r.km)) : 0;
    const totalCost = vRef.reduce((a,b) => a + b.cost, 0) + vMaint.reduce((a,b) => a + b.cost, 0);
    const vehicleTabs = vehicles.map(ve => '<button class="tab-btn ' + (ve.id === v.id ? 'active' : '') + '" onclick="robin.selectVehicle(\'' + ve.id + '\')">' + ve.name + '</button>').join('');
    const refHtml = vRef.slice(-5).reverse().map(r => '<div class="item-row"><div class="item-info"><div class="item-title">⛽ Rifornimento</div><div class="item-sub">' + r.date.split('-').reverse().join('/') + ' · ' + r.liters + 'L · ' + r.km + 'km</div></div><div class="item-value">' + App.formatCurrency(r.cost) + '</div></div>').join('') || '<div class="empty-state">Nessun rifornimento</div>';
    const maintHtml = vMaint.slice(-5).reverse().map(m => '<div class="item-row"><div class="item-info"><div class="item-title">🔧 ' + m.type + '</div><div class="item-sub">' + m.date.split('-').reverse().join('/') + ' · ' + m.km + 'km</div></div><div class="item-value">' + App.formatCurrency(m.cost) + '</div></div>').join('') || '<div class="empty-state">Nessuna manutenzione</div>';
    return '
      <div class="card"><div class="card-title">💬 Parla con Robin</div>
        <button class="btn btn-primary mb-1" onclick="ChatEngine.openChat(\'robin\')">Apri chat con Robin</button>
        <div style="font-size:12px;color:var(--text-2)">Chiedi di veicoli, km, carburante, manutenzione, costi...</div>
      </div>
      <div class="tabs">' + vehicleTabs + '</div>
      <div class="card"><div class="card-title">🏍️ ' + v.name + ' · ' + v.fuelType + '</div>
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-value">' + totalKm.toLocaleString('it-IT') + '</div><div class="stat-label">Km totali</div></div>
          <div class="stat-box"><div class="stat-value">' + App.formatCurrency(totalCost) + '</div><div class="stat-label">Spesa totale</div></div>
          <div class="stat-box"><div class="stat-value">' + (lastRef ? (lastRef.cost/lastRef.liters).toFixed(2)+'€/L' : '-') + '</div><div class="stat-label">Ultimo prezzo</div></div>
          <div class="stat-box"><div class="stat-value">' + vRef.length + '</div><div class="stat-label">Rifornimenti</div></div>
        </div>
      </div>
      <div class="card"><div class="flex flex-between mb-1"><div class="card-title">⛽ Rifornimenti</div><button class="btn btn-sm btn-primary" onclick="robin.openAddRefuel()">+ Rifornimento</button></div><div class="item-list">' + refHtml + '</div></div>
      <div class="card"><div class="flex flex-between mb-1"><div class="card-title">🔧 Manutenzione</div><button class="btn btn-sm btn-primary" onclick="robin.openAddMaint()">+ Intervento</button></div><div class="item-list">' + maintHtml + '</div></div>
      <div class="card"><div class="card-title">➕ Aggiungi veicolo</div><div class="flex gap-1"><input type="text" id="new-vehicle-name" placeholder="Nome veicolo" style="flex:1"><input type="text" id="new-vehicle-fuel" placeholder="Carburante" style="flex:1"><button class="btn btn-primary" style="width:auto" onclick="robin.addVehicle()">Aggiungi</button></div></div>';
  },
  init() {},
  selectVehicle(id) { this.selectedVehicle = id; App.navigate('robin'); },
  addVehicle() {
    const name = document.getElementById('new-vehicle-name').value.trim();
    const fuel = document.getElementById('new-vehicle-fuel').value.trim() || 'Benzina';
    if (!name) return alert('Inserisci il nome del veicolo');
    const vehicles = DB.get('transport_vehicles');
    const id = (vehicles.length + 1).toString();
    vehicles.push({ id, name, fuelType: fuel });
    DB.set('transport_vehicles', vehicles);
    this.selectedVehicle = id;
    App.navigate('robin');
  },
  openAddRefuel() {
    App.openModal('Rifornimento ' + this.selectedVehicle, '<div class="form-group"><label>Litri</label><input type="number" id="ref-liters" step="0.01" placeholder="Es. 35.5"></div><div class="form-group"><label>Costo totale (€)</label><input type="number" id="ref-cost" step="0.01" placeholder="Es. 60.00"></div><div class="form-group"><label>Km attuali</label><input type="number" id="ref-km" placeholder="Es. 45000"></div><div class="form-group"><label>Data</label><input type="date" id="ref-date" value="' + App.formatDate() + '"></div><button class="btn btn-primary" onclick="robin.saveRefuel()">Salva</button>');
  },
  saveRefuel() {
    const liters = parseFloat(document.getElementById('ref-liters').value);
    const cost = parseFloat(document.getElementById('ref-cost').value);
    const km = parseInt(document.getElementById('ref-km').value);
    const date = document.getElementById('ref-date').value;
    if (!liters || !cost || !km || !date) return alert('Compila tutti i campi');
    const r = DB.get('transport_refuels');
    r.push({ id: Date.now().toString(), vehicleId: this.selectedVehicle, liters, cost, km, date });
    DB.set('transport_refuels', r);
    App.closeModal();
    App.navigate('robin');
  },
  openAddMaint() {
    App.openModal('Manutenzione ' + this.selectedVehicle, '<div class="form-group"><label>Tipo intervento</label><input type="text" id="maint-type" placeholder="Es. Tagliando, Gomme, Freni..."></div><div class="form-group"><label>Costo (€)</label><input type="number" id="maint-cost" step="0.01" placeholder="Es. 150.00"></div><div class="form-group"><label>Km attuali</label><input type="number" id="maint-km" placeholder="Es. 45000"></div><div class="form-group"><label>Data</label><input type="date" id="maint-date" value="' + App.formatDate() + '"></div><button class="btn btn-primary" onclick="robin.saveMaint()">Salva</button>');
  },
  saveMaint() {
    const type = document.getElementById('maint-type').value;
    const cost = parseFloat(document.getElementById('maint-cost').value);
    const km = parseInt(document.getElementById('maint-km').value);
    const date = document.getElementById('maint-date').value;
    if (!type || !cost || !km || !date) return alert('Compila tutti i campi');
    const m = DB.get('transport_maintenance');
    m.push({ id: Date.now().toString(), vehicleId: this.selectedVehicle, type, cost, km, date });
    DB.set('transport_maintenance', m);
    App.closeModal();
    App.navigate('robin');
  }
};

const oracle = {
  tab: 'archive',
  render() {
    return '
      <div class="card"><div class="card-title">💬 Parla con Oracle</div>
        <button class="btn btn-primary mb-1" onclick="ChatEngine.openChat(\'oracle\')">Apri chat con Oracle</button>
        <div style="font-size:12px;color:var(--text-2)">Chiedi di file, archivio, gadget, progetti Hi-Tek...</div>
      </div>
      <div class="tabs">
        <button class="tab-btn ' + (this.tab==='archive'?'active':'') + '" onclick="oracle.switchTab(\'archive\')">📁 Archivio</button>
        <button class="tab-btn ' + (this.tab==='hitek'?'active':'') + '" onclick="oracle.switchTab(\'hitek\')">🔧 Hi-Tek</button>
      </div>
      ' + (this.tab === 'archive' ? this.renderArchive() : this.renderHiTek());
  },
  init() {},
  switchTab(t) { this.tab = t; App.navigate('oracle'); },
  renderArchive() {
    const allNotes = DB.get('notes');
    const search = document.getElementById('note-search')?.value?.toLowerCase() || '';
    const filtered = search ? allNotes.filter(n => n.title.toLowerCase().includes(search) || n.content.toLowerCase().includes(search)) : allNotes;
    const list = filtered.slice().reverse().map(n => '<div class="item-row"><div class="item-info"><div class="item-title">' + n.title + '</div><div class="note-preview">' + n.content + '</div><div class="item-sub">' + n.date.split('-').reverse().join('/') + '</div></div><div class="item-actions"><button class="btn btn-sm btn-danger" onclick="oracle.deleteNote(\'' + n.id + '\')">✕</button></div></div>').join('') || '<div class="empty-state"><div class="emoji">📁</div>Archivio vuoto</div>';
    return '<div class="card"><div class="flex flex-between mb-1"><div class="card-title">📁 File archiviati</div><button class="btn btn-sm btn-primary" onclick="oracle.openAddNote()">+ Nuovo</button></div><div class="form-group"><input type="text" id="note-search" placeholder="🔍 Cerca nell\'archivio..." value="' + search + '" oninput="oracle.search()"></div><div class="item-list">' + list + '</div></div>';
  },
  renderHiTek() {
    const items = DB.get('hitek_items');
    const list = items.slice().reverse().map(i => {
      const badgeClass = i.status === 'In sviluppo' ? 'badge-dev' : i.status === 'Completato' ? 'badge-done' : 'badge-maint';
      return '<div class="item-row"><div class="item-info"><div class="item-title">' + i.name + ' <span class="badge ' + badgeClass + '">' + i.status + '</span></div><div class="note-preview">' + i.desc + '</div><div class="item-sub">' + i.date.split('-').reverse().join('/') + '</div></div><div class="item-actions"><button class="btn btn-sm btn-danger" onclick="oracle.deleteHiTek(\'' + i.id + '\')">✕</button></div></div>';
    }).join('') || '<div class="empty-state"><div class="emoji">🔧</div>Nessun progetto Hi-Tek</div>';
    return '<div class="card"><div class="flex flex-between mb-1"><div class="card-title">🔧 Laboratorio Hi-Tek</div><button class="btn btn-sm btn-primary" onclick="oracle.openAddHiTek()">+ Progetto</button></div><div class="item-list">' + list + '</div></div>';
  },
  search() { App.navigate('oracle'); },
  openAddNote() {
    App.openModal('Nuovo file', '<div class="form-group"><label>Titolo</label><input type="text" id="note-title" placeholder="Titolo file"></div><div class="form-group"><label>Contenuto</label><textarea id="note-content" rows="6" placeholder="Inserisci dati..."></textarea></div><button class="btn btn-primary" onclick="oracle.saveNote()">Archivia</button>');
  },
  saveNote() {
    const title = document.getElementById('note-title').value.trim();
    const content = document.getElementById('note-content').value.trim();
    if (!title) return alert('Inserisci un titolo');
    const n = DB.get('notes');
    n.push({ id: Date.now().toString(), title, content, date: App.formatDate() });
    DB.set('notes', n);
    App.closeModal();
    App.navigate('oracle');
  },
  deleteNote(id) {
    if (!confirm('Eliminare questo file?')) return;
    DB.set('notes', DB.get('notes').filter(x => x.id !== id));
    App.navigate('oracle');
  },
  openAddHiTek() {
    App.openModal('Nuovo progetto Hi-Tek', '<div class="form-group"><label>Nome progetto / gadget</label><input type="text" id="ht-name" placeholder="Es. Batarang MK-II"></div><div class="form-group"><label>Stato</label><select id="ht-status"><option value="In sviluppo">🔵 In sviluppo</option><option value="Completato">🟢 Completato</option><option value="In manutenzione">🟠 In manutenzione</option></select></div><div class="form-group"><label>Descrizione</label><textarea id="ht-desc" rows="4" placeholder="Specifiche tecniche, note..."></textarea></div><div class="form-group"><label>Data</label><input type="date" id="ht-date" value="' + App.formatDate() + '"></div><button class="btn btn-primary" onclick="oracle.saveHiTek()">Registra</button>');
  },
  saveHiTek() {
    const name = document.getElementById('ht-name').value.trim();
    const status = document.getElementById('ht-status').value;
    const desc = document.getElementById('ht-desc').value.trim();
    const date = document.getElementById('ht-date').value;
    if (!name || !date) return alert('Inserisci nome e data');
    const items = DB.get('hitek_items');
    items.push({ id: Date.now().toString(), name, status, desc, date });
    DB.set('hitek_items', items);
    App.closeModal();
    App.navigate('oracle');
  },
  deleteHiTek(id) {
    if (!confirm('Eliminare questo progetto?')) return;
    DB.set('hitek_items', DB.get('hitek_items').filter(x => x.id !== id));
    App.navigate('oracle');
  }
};

const App = {
  currentSection: 'batcomputer',
  modalCallback: null,
  init() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => this.navigate(btn.dataset.section));
    });
    document.getElementById('theme-toggle').addEventListener('click', () => this.toggleTheme());
    this.loadTheme();
    this.navigate('batcomputer');
  },
  navigate(section) {
    this.currentSection = section;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === section));
    const main = document.getElementById('main-content');
    main.innerHTML = '<div class="section-content">' + this.getSectionHTML(section) + '</div>';
    if (window[section] && window[section].init) window[section].init();
  },
  getSectionHTML(section) {
    const map = { batcomputer: batcomputer.render(), alfred: alfred.render(), fox: fox.render(), robin: robin.render(), oracle: oracle.render() };
    return map[section] || '<div class="empty-state">Sezione in costruzione 🚧</div>';
  },
  toggleTheme() {
    const html = document.documentElement;
    const next = html.dataset.theme === 'light' ? 'dark' : 'light';
    html.dataset.theme = next;
    localStorage.setItem('bc_theme', next);
    document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
  },
  loadTheme() {
    const saved = localStorage.getItem('bc_theme') || 'dark';
    document.documentElement.dataset.theme = saved;
    document.getElementById('theme-toggle').textContent = saved === 'dark' ? '🌙' : '☀️';
  },
  openModal(title, contentHTML, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'active-modal';
    overlay.innerHTML = '<div class="modal"><div class="modal-header"><h3>' + title + '</h3><button class="modal-close" onclick="App.closeModal()">✕</button></div><div class="modal-body">' + contentHTML + '</div></div>';
    document.body.appendChild(overlay);
    this.modalCallback = onConfirm;
    requestAnimationFrame(() => overlay.classList.add('active'));
    overlay.addEventListener('click', e => { if(e.target === overlay) this.closeModal(); });
  },
  closeModal() {
    const m = document.getElementById('active-modal');
    if (m) { m.classList.remove('active'); setTimeout(() => m.remove(), 300); }
    this.modalCallback = null;
  },
  formatDate(d = new Date()) { return d.toISOString().split('T')[0]; },
  formatCurrency(n) { return new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'}).format(n); }
};
document.addEventListener('DOMContentLoaded', () => App.init());

</script>
